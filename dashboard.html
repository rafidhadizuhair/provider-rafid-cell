<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layanan</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/your-code.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="app-container">
        <header class="top-nav">
            <div class="profile-icon">👤</div>
            <div class="logo">LAPOR!</div>
            <div class="nav-icons">
                <span>🔍</span>
                <span>🔔</span>
                <span>🎧</span>
            </div>
        </header>

        <section class="info-card">
            <div class="card-header">
                <span>🌐 AlwaysOn 100GB UL + 1 lainnya</span>
                <span>❯</span>
            </div>
            <div class="card-stats">
                <div class="stat-item">
                    <p class="stat-value">Rp 100.000</p>
                    <button class="action-btn">+ Isi Pulsa</button>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <p class="stat-value">100.00 GB</p>
                    <button class="action-btn">🌐 Paket Data</button>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <p class="stat-value">1000 Poin</p>
                    <button class="action-btn">🎁 Tukarkan</button>
                </div>
            </div>
        </section>

        <section class="product-section">
            <div class="section-title">
                <h3>⋮ Pasti Murah</h3>
                <a href="#">Lainnya ❯</a>
            </div>
            <div class="product-grid">
                <div class="product-card"><strong>50GB</strong><span>Rp 50.000</span></div>
                <div class="product-card"><strong>80GB</strong><span>Rp 80.000</span></div>
                <div class="product-card"><strong>90GB</strong><span>Rp 90.000</span></div>
                <div class="product-card"><strong>100GB</strong><span>Rp 100.000</span></div>
            </div>
        </section>

        <section class="product-section">
            <div class="section-title">
                <h3>⋮ Voucher Game</h3>
                <a href="#">Lainnya ❯</a>
            </div>
            <div class="product-grid">
                <div class="product-card"><strong>Free Fire</strong><span>Rp 20.000</span></div>
                <div class="product-card"><strong>PUBG</strong><span>Rp 100.000</span></div>
                <div class="product-card"><strong>ML</strong><span>Rp 75.000</span></div>
                <div class="product-card"><strong>FC Mobile</strong><span>Rp 150.000</span></div>
            </div>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item">🏠</div>
            <div class="nav-item">🛍️</div>
            <div class="nav-item qr-btn">🔳</div>
            <div class="nav-item">⭐</div>
            <div class="nav-item">👤</div>
        </nav>
    </div>
</body>
</html>
